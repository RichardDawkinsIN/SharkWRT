name: Build APK from ZIP

# Put the project ZIP anywhere in the repo root (for example SharkWRT-liquid-glass.zip) and push.
# This workflow unzips it, finds the Gradle project inside, compiles it and publishes the APK.
# No secrets or keystore needed — it builds a debug-signed release APK, which installs directly on a phone.
#
# This file must be saved in the repo as:  .github/workflows/build.yml
#
# Where to find the APK afterwards:
#   * Releases page -> "Latest build" pre-release (always the newest)
#   * Actions tab   -> the run -> Artifacts -> sharkwrt-release-apk

on:
  push:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: build-zip-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Unzip and compile
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Unzip the project
        id: project
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/src"

          # The newest ZIP in the repo root, if there is one.
          zip=$(ls -t ./*.zip 2>/dev/null | head -1 || true)
          if [[ -n "$zip" ]]; then
            echo "Unzipping $zip"
            unzip -q -o "$zip" -d "$RUNNER_TEMP/src"
            search="$RUNNER_TEMP/src"
          else
            echo "No ZIP in the repo root — using the repo itself."
            search="."
          fi

          # The Gradle project is wherever settings.gradle(.kts) lives, however deep the ZIP nested it.
          settings=$(find "$search" -maxdepth 4 \( -name settings.gradle.kts -o -name settings.gradle \) \
            -not -path '*/node_modules/*' | head -1)
          if [[ -z "$settings" ]]; then
            echo "::error::No settings.gradle(.kts) found — is this the SharkWRT project?"
            exit 1
          fi
          dir=$(dirname "$settings")
          echo "Gradle project: $dir"
          echo "dir=$dir" >> "$GITHUB_OUTPUT"

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build release APK
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease --stacktrace

      - name: Name the APK
        id: apk
        working-directory: ${{ steps.project.outputs.dir }}
        run: |
          set -euo pipefail
          src=$(ls app/build/outputs/apk/release/*.apk | head -1)
          cp "$src" "$GITHUB_WORKSPACE/SharkWRT-release.apk"
          ls -la "$GITHUB_WORKSPACE/SharkWRT-release.apk"

      - name: Upload APK as a workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: sharkwrt-release-apk
          path: SharkWRT-release.apk
          if-no-files-found: error
          retention-days: 30

      - name: Publish rolling "latest" release
        if: github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: Latest build
          prerelease: true
          make_latest: false
          body: |
            Automatic release build of commit ${{ github.sha }} (run #${{ github.run_number }}).
          files: SharkWRT-release.apk
